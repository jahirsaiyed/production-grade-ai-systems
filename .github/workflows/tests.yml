name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: modules/week-01-prototype-to-production/labs/ml-track-fraud-detection
            cov: app
          - dir: modules/week-01-prototype-to-production/labs/llm-track-qa-service
            cov: app
          - dir: modules/week-02-data-and-model-pipelines/labs/llm-track-rag-service
            cov: app
          - dir: modules/week-02-data-and-model-pipelines/labs/ml-track-experiment-tracking
            cov: .
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=${{ matrix.cov }} --cov-report=term-missing --cov-fail-under=80
